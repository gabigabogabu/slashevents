name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: slashevents
          POSTGRES_PASSWORD: slashevents
          POSTGRES_DB: slashevents_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U slashevents -d slashevents_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DB_URL: postgres://slashevents:slashevents@localhost:5432/slashevents_test
      # Compose smoke test: runs docker-compose.yml as shipped, including read-only
      # filesystem, dropped capabilities and no-new-privileges, against the CI image.
      SLASHEVENTS_IMAGE: slashevents:ci
      POSTGRES_PASSWORD: ci-postgres-password
      SLASHEVENTS_API_TOKEN: ci-test-token-at-least-32-characters
      RETENTION_INTERVAL_SECONDS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build
      - run: bun test ./src
      - run: docker build -t slashevents:ci .
      - name: Compose smoke test
        run: |
          docker compose up -d --wait --wait-timeout 120
          bun run test:smoke
          docker compose restart app
          bun run test:smoke -- --verify
          docker compose stop -t 15 app
          test "$(docker inspect --format '{{.State.ExitCode}}' "$(docker compose ps -aq app)")" = 0
      - name: Compose logs
        if: failure()
        run: docker compose logs
      - name: Compose cleanup
        if: always()
        run: docker compose down -v --remove-orphans
